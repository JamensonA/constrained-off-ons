[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "constrained-off-ons"
version = "0.1.0"
description = "Analise descritiva reproduzivel do constrained-off (energia nao gerada) de usinas eolicas e fotovoltaicas com dados abertos do ONS."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jamenson Alves Junior" }]
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=15",
    "requests>=2.31",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = ["ruff>=0.5", "pytest>=8", "jupyter>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
